name: Build

on:
    workflow_call:
        inputs:
            swift-release:
                description: 'Swift release, such as 6.4.1-RELEASE'
                required: true
                type: string

jobs:
    #   builds the compiler and standard library, and packages the files that replace Apple’s
    compiler:
        strategy:
            matrix:
                runner: [ubuntu-24.04, ubuntu-24.04-arm]
        runs-on: ${{ matrix.runner }}
        name: compiler (${{ matrix.runner }})
        timeout-minutes: 360
        env:
            SWIFT_RELEASE: ${{ inputs.swift-release }}
            GH_TOKEN: ${{ github.token }}
        steps:
            #   runners of the same label can differ in CPU, which changes how long the build takes
            -   name: 💝 Describe runner 💝
                run: lscpu

            -   name: 💝 Checkout 💝
                uses: actions/checkout@v6

            -   name: 💝 Read pins 💝
                run: |
                    source "Releases/${SWIFT_RELEASE}"
                    {
                        echo "PATCHES<<EOF"
                        echo "${PATCHES}"
                        echo "EOF"
                    } >> "$GITHUB_ENV"

            -   name: 💝 Free disk 💝
                run: |
                    sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                        /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                        /usr/local/share/powershell /usr/local/share/chromium \
                        /usr/local/lib/node_modules
                    df -h /

            -   name: 💝 Install dependencies 💝
                run: |
                    sudo apt-get update -q
                    sudo apt-get -y -q install \
                        build-essential cmake curl git gnupg icu-devtools \
                        libc++-18-dev libc++abi-18-dev libcurl4-openssl-dev libedit-dev \
                        libicu-dev libncurses-dev libpython3-dev libsqlite3-dev libxml2-dev \
                        ninja-build pkg-config python3-six python3-pip \
                        python3-pkg-resources python3-psutil python3-setuptools rsync swig \
                        systemtap-sdt-dev tzdata uuid-dev zip

            #   clang builds against the newest GCC’s libstdc++ it finds, and Apple’s toolchain was
            #   built against GCC 13’s, which is Ubuntu 24.04’s own. The runner also has GCC 14,
            #   whose template instantiations would show up among our libraries’ exported symbols
            -   name: 💝 Remove newer GCCs 💝
                run: |
                    sudo apt-get -y -q purge libgcc-14-dev
                    ls "/usr/lib/gcc/$(gcc -dumpmachine)"
                    [[ "$(ls "/usr/lib/gcc/$(gcc -dumpmachine)" | sort -V | tail -1)" == 13 ]]

            -   name: 💝 Install Swift 💝
                uses: rarestype/swift-install-action@v1
                with:
                    swift-release: ${{ inputs.swift-release }}

            -   name: 💝 Check out sources 💝
                run: |
                    sudo mkdir -p /workspace
                    sudo chown "$(id -u):$(id -g)" /workspace
                    Scripts/Checkout /workspace

            -   name: 💝 Build 💝
                run: Scripts/Build /workspace

            -   name: 💝 Package 💝
                run: |
                    usr="$(dirname "$(dirname "$(readlink -f "$(command -v swift)")")")"
                    Scripts/Package /workspace "$usr"

            -   name: 💝 Upload 💝
                uses: actions/upload-artifact@v7
                with:
                    name: compiler-${{ runner.arch }}
                    path: artifacts/*.tar.gz
                    retention-days: 1
                    compression-level: 0

    #   builds SwiftPM and the swift-syntax prebuilts with the compiler just built, and adds
    #   SwiftPM to the archive
    swiftpm:
        strategy:
            matrix:
                runner: [ubuntu-24.04, ubuntu-24.04-arm]
        runs-on: ${{ matrix.runner }}
        name: swiftpm (${{ matrix.runner }})
        needs: compiler
        env:
            SWIFT_RELEASE: ${{ inputs.swift-release }}
        steps:
            -   name: 💝 Checkout 💝
                uses: actions/checkout@v6

            -   name: 💝 Read pins 💝
                run: |
                    source "Releases/${SWIFT_RELEASE}"
                    echo "SWIFTPM_REVISION=${SWIFTPM_REVISION}" >> "$GITHUB_ENV"
                    echo "SWIFT_SYNTAX_VERSIONS=${SWIFT_SYNTAX_VERSIONS}" >> "$GITHUB_ENV"

            -   name: 💝 Install patchelf 💝
                run: |
                    sudo apt-get update -q
                    sudo apt-get -y -q install patchelf

            -   name: 💝 Install Swift 💝
                uses: rarestype/swift-install-action@v1
                with:
                    swift-release: ${{ inputs.swift-release }}

            -   name: 💝 Download 💝
                uses: actions/download-artifact@v7
                with:
                    name: compiler-${{ runner.arch }}
                    path: artifacts

            -   name: 💝 Install over the toolchain 💝
                run: |
                    usr="$(dirname "$(dirname "$(readlink -f "$(command -v swift)")")")"
                    tar -C "$(dirname "$usr")" -xzf artifacts/swift-*.tar.gz
                    mkdir stage
                    tar -C stage -xzf artifacts/swift-*.tar.gz
                    swift --version

            -   name: 💝 Build SwiftPM 💝
                run: Scripts/BuildSwiftPM stage

            -   name: 💝 Build prebuilts 💝
                run: Scripts/BuildPrebuilts

            -   name: 💝 Package 💝
                run: Scripts/Archive stage

            -   name: 💝 Upload 💝
                uses: actions/upload-artifact@v7
                with:
                    name: swift-${{ runner.arch }}
                    path: artifacts/*.tar.gz
                    retention-days: 7
                    compression-level: 0

            -   name: 💝 Upload prebuilts 💝
                uses: actions/upload-artifact@v7
                with:
                    name: prebuilts-${{ runner.arch }}
                    path: prebuilts/
                    retention-days: 7
                    compression-level: 0

            -   name: 💝 Upload prebuilts tool 💝
                uses: actions/upload-artifact@v7
                with:
                    name: tool-${{ runner.arch }}
                    path: swiftpm/.build/release/swift-build-prebuilts
                    retention-days: 7

    #   installs the archive over Apple’s toolchain, as the images do, and runs the gate. The
    #   prebuilts are signed with a key made for this run, since the real one only signs releases
    test:
        strategy:
            matrix:
                runner: [ubuntu-24.04, ubuntu-24.04-arm]
        runs-on: ${{ matrix.runner }}
        name: test (${{ matrix.runner }})
        needs: swiftpm
        env:
            SWIFT_RELEASE: ${{ inputs.swift-release }}
        steps:
            -   name: 💝 Checkout 💝
                uses: actions/checkout@v6

            -   name: 💝 Read pins 💝
                run: |
                    source "Releases/${SWIFT_RELEASE}"
                    echo "SWIFT_SYNTAX_VERSIONS=${SWIFT_SYNTAX_VERSIONS}" >> "$GITHUB_ENV"

            -   name: 💝 Install Swift 💝
                uses: rarestype/swift-install-action@v1
                with:
                    swift-release: ${{ inputs.swift-release }}

            -   name: 💝 Download 💝
                uses: actions/download-artifact@v7
                with:
                    name: swift-${{ runner.arch }}
                    path: artifacts

            -   name: 💝 Download prebuilts 💝
                uses: actions/download-artifact@v7
                with:
                    name: prebuilts-${{ runner.arch }}
                    path: prebuilts

            -   name: 💝 Download prebuilts tool 💝
                uses: actions/download-artifact@v7
                with:
                    name: tool-${{ runner.arch }}
                    path: tool

            #   also installs the archive over the toolchain
            -   name: 💝 Compare with Apple’s toolchain 💝
                run: |
                    usr="$(dirname "$(dirname "$(readlink -f "$(command -v swift)")")")"
                    mkdir overlay
                    tar -C overlay -xzf artifacts/swift-*.tar.gz
                    Scripts/Compare overlay/usr "$usr"
                    cat "$usr/share/swift/rarest-overlay.txt"

            -   name: 💝 Test 💝
                run: Scripts/Test

            -   name: 💝 Sign prebuilts with a key for this run 💝
                run: |
                    chmod +x tool/swift-build-prebuilts
                    Scripts/MakeTestCertificates test-certificates
                    PREBUILTS_SIGNING_KEY="$(cat test-certificates/signing.key.pem)" \
                        Scripts/SignPrebuilts
                env:
                    PREBUILTS_TOOL: tool/swift-build-prebuilts
                    CERTIFICATES: test-certificates

            -   name: 💝 Verify prebuilts 💝
                run: Scripts/VerifyPrebuilts
                env:
                    PREBUILTS_ROOT_CERT: test-certificates/root.cer
