name: Watch

permissions:
    issues: write
on:
    schedule:
        -   cron: '0 9 * * 1'
    workflow_dispatch:

jobs:
    #   opens an issue for every Swift release newer than the newest one under Releases/
    releases:
        runs-on: ubuntu-24.04
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            -   name: 💝 Checkout 💝
                uses: actions/checkout@v6

            -   name: 💝 Check for new releases 💝
                run: |
                    newest=$(ls Releases | sort -V | tail -1)
                    gh api --paginate repos/swiftlang/swift/tags --jq '.[].name' \
                        | sed -n 's/^swift-\([0-9.]*-RELEASE\)$/\1/p' \
                        | sort -V \
                        | awk -v newest="$newest" '$0 == newest { found = 1; next } found' \
                        | while read -r release; do
                            title="Build Swift ${release}"
                            if gh issue list --state all --search "in:title \"${title}\"" \
                                --json title --jq '.[].title' | grep -qxF "$title"; then
                                continue
                            fi
                            gh issue create --title "$title" --body "Swift ${release} is out. Add \`Releases/${release}\`, carrying over every patch that the release doesn’t contain, then run Deploy."
                        done
