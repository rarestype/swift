name: Test

on:
    pull_request:

jobs:
    #   builds the newest release under Releases/, which is the one a pull request adds
    newest:
        runs-on: ubuntu-24.04
        outputs:
            swift-release: ${{ steps.newest.outputs.swift-release }}
        steps:
            -   name: 💝 Checkout 💝
                uses: actions/checkout@v6

            -   name: 💝 Find newest release 💝
                id: newest
                run: echo "swift-release=$(ls Releases | sort -V | tail -1)" >> "$GITHUB_OUTPUT"

    build:
        needs: newest
        uses: ./.github/workflows/Build.yml
        with:
            swift-release: ${{ needs.newest.outputs.swift-release }}
